name: Build Shroudweave Minimap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Prepare pinned shader compiler
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'minimap-glslang-16.6.0'
          $archive = "$toolRoot.zip"
          Invoke-WebRequest 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ine '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b') { throw 'Shader compiler archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $compiler = @(Get-ChildItem -LiteralPath $toolRoot -Recurse -File -Filter glslang.exe)
          if ($compiler.Count -ne 1) { throw 'Expected one shader compiler' }
          "MINIMAP_GLSLANG=$($compiler[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check source inventory and workflow inputs
        shell: pwsh
        run: ./ci/pipeline-tests.ps1
      - name: Build, run focused tests, and package
        shell: pwsh
        run: ./ci/build.ps1 -OutputDirectory ./dist
      - name: Read verified package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./dist/BUILD-RECEIPT.json -Raw | ConvertFrom-Json).version
          if ($version -cnotin @('0.5.15', '0.5.16-gpu-reporter-test.2')) { throw 'Unexpected package version' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: shroudweave-minimap-v${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/BUILD-RECEIPT.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
