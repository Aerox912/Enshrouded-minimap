name: Minimap public checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Prepare pinned shader compiler
        shell: pwsh
        run: ./ci/prepare-shader-compiler.ps1
      - name: Check pipeline rejection and archive exclusion contracts
        shell: pwsh
        run: ./ci/pipeline-tests.ps1
      - name: Build and run public checks without proprietary fixtures
        shell: pwsh
        run: ./ci/build.ps1 -AllowMissingFixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minimap-public-checks-${{ github.sha }}
          path: dist/BUILD-RECEIPT.json
          if-no-files-found: error