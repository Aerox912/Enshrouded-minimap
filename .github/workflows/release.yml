name: Build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build, test and package
        shell: pwsh
        run: ./ci/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: minimap
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets=@(Get-ChildItem ./dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --generate-notes @assets
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE) { throw 'Release publication failed' }

  notify-packages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Aerox912
          repositories: |
            enshrouded-client-installer
          permission-contents: write
      - name: Notify only affected packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          $body=@{event_type='component-released';client_payload=@{component='minimap';tag=$env:GITHUB_REF_NAME}} | ConvertTo-Json -Compress
          $body | Set-Content ./dispatch.json -Encoding utf8
          foreach($repo in @('enshrouded-client-installer')) {
            gh api --method POST "repos/Aerox912/$repo/dispatches" --input ./dispatch.json
            if($LASTEXITCODE){throw 'Package notification failed'}
          }
